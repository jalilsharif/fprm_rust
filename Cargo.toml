[package]
name = "fprm_rust"
version = "0.1.0"
edition = "2021"
description = "FPRM: phase-space reconstruction + Gaussian process imputation (MATLAB port)"
license = "MIT"
readme = "README.md"

[lib]
name = "fprm_rust"
path = "src/lib.rs"

[[bin]]
name = "fprm"
path = "src/bin/fprm.rs"

[dependencies]
anyhow = "1"
calamine = "0.26"
clap = { version = "4", features = ["derive"] }
csv = "1"
ndarray = { version = "0.16", features = ["rayon"] }
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
approx = "0.5"
